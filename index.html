/* -------------------------------- Rearing tubs -------------------------------- */

/** Flat 2D cross-section diagram of a rearing tub — matching the reference husbandry diagrams:
 *  a firmly-packed substrate base, a softer top layer, anti-tip fiber tufts, a jelly cup, and (for
 *  stag-beetle boxes) 0-3 embedded wood-log circles poking just above the soft/hard boundary. */
function TubSection({ useRottenWood, rottenWoodCount, compaction, boxSizeL, progressDots }) {
  const logCount = useRottenWood ? Math.min(3, Math.max(0, Number(rottenWoodCount) || 0)) : 0;
  const c = Math.min(100, Math.max(0, Number(compaction)));

  // 3 fixed colors (light/medium/dark), whose relative thickness in the stack shifts with %:
  // low % = mostly the light (loose, "ไม่อัดแมท") layer; high % = mostly the dark (packed) layer.
  const lerp = (a, b, t) => a + (b - a) * t;
  const ANCHORS = { dark: [8, 25, 72], medium: [22, 55, 20], light: [70, 20, 8] }; // at c=0, 50, 100
  const t = c <= 50 ? c / 50 : (c - 50) / 50;
  const [i0, i1] = c <= 50 ? [0, 1] : [1, 2];
  const darkPct = lerp(ANCHORS.dark[i0], ANCHORS.dark[i1], t);
  const mediumPct = lerp(ANCHORS.medium[i0], ANCHORS.medium[i1], t);
  const lightPct = lerp(ANCHORS.light[i0], ANCHORS.light[i1], t);
  const total = darkPct + mediumPct + lightPct;

  // Only the top 10% is left as open air/feeding space — the rest (90%) is all substrate/mat,
  // represented by the light("ไม่อัดแมท")/medium/dark("อัดแน่นมาก") compaction stack.
  const HARD_ZONE_TOP = 10, HARD_ZONE_HEIGHT = 90;
  // The dark ("very packed") layer sits at the bottom of that zone; its top edge shifts with %.
  const darkLayerTopY = HARD_ZONE_TOP + HARD_ZONE_HEIGHT * (1 - darkPct / total);

  return (
    <div className="tubsection-stage">
      <div className="tubsection">
      {boxSizeL && <div className="tubsection-size mono">{boxSizeL} L</div>}
      <div className="tubsection-vents">
        <div className="tubsection-vent-hole" />
        <div className="tubsection-vent-hole" />
        <div className="tubsection-vent-hole" />
      </div>
      <div className="tubsection-air" />
      <div className="tubsection-hard">
        <div className="tubsection-layer tubsection-layer-light" style={{ height: `${(lightPct / total) * 100}%` }} />
        <div className="tubsection-layer tubsection-layer-medium" style={{ height: `${(mediumPct / total) * 100}%` }} />
        <div className="tubsection-layer tubsection-layer-dark" style={{ height: `${(darkPct / total) * 100}%` }} />
        {progressDots > 0 && (
          <div className="tubsection-progress">
            {Array.from({ length: progressDots }).map((_, i) => (
              <span
                className="tubsection-progress-dot"
                key={i}
                style={{
                  top: `${8 + pseudoRandom(i * 2 + 1) * 84}%`,
                  left: `${6 + pseudoRandom(i * 2 + 7) * 88}%`,
                  animationDelay: `${pseudoRandom(i * 2 + 13) * 3}s`,
                  animationDuration: `${1.6 + pseudoRandom(i * 2 + 19) * 1.8}s`,
                }}
              />
            ))}
          </div>
        )}
      </div>
      {logCount > 0 && (
        <div className="tubsection-logs" style={{ top: `${darkLayerTopY}%` }}>
          {Array.from({ length: logCount }).map((_, i) => <div className="tubsection-log" key={i} />)}
        </div>
      )}
      </div>
    </div>
  );
}


function TubForm({ initial, pairings, enclosures, beetles, onSave, onClose }) {
  const [f, setF] = useState({ ...emptyTub(), ...initial });
  const set = (k, v) => setF((p) => ({ ...p, [k]: v }));

  const applyPairing = (pairingId) => {
    const p = pairings.find((x) => x.id === pairingId);
    if (p) {
      const dam = beetles.find((b) => b.id === p.damId);
      const sire = beetles.find((b) => b.id === p.sireId);
      const src = dam || sire;
      setF((prev) => ({ ...prev, pairingId, species: src ? src.species : prev.species, speciesCode: src ? src.speciesCode : prev.speciesCode }));
    } else {
      set("pairingId", pairingId);
    }
  };

  const submit = () => onSave({
    ...f,
    id: f.id || uid("TUB"),
    eggCount: f.eggCount === "" ? 0 : Number(f.eggCount),
    larvaCount: f.larvaCount === "" ? 0 : Number(f.larvaCount),
    rottenWoodCount: f.useRottenWood ? Math.min(3, Math.max(0, Number(f.rottenWoodCount) || 0)) : "",
  });

  return (
    <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 500 }}>
        <div className="modal-head">
          <h3>{initial.id ? "แก้ไขถังเพาะ" : "เพิ่มถังเพาะใหม่"}</h3>
          <button className="btn btn-ghost btn-sm" onClick={onClose}><XIcon size={16} /></button>
        </div>
        <div className="form-grid">
          <div className="form-field span2"><label>ชื่อถังเพาะ</label><input className="form-input" placeholder="เช่น ถังเพาะ #1 — ไข่ CCA รุ่นกรกฎาคม" value={f.label} onChange={(e) => set("label", e.target.value)} /></div>
          <div className="form-field span2">
            <label>เชื่อมกับคู่ผสม (ถ้ามี — จะดึงสายพันธุ์ให้อัตโนมัติ)</label>
            <select className="form-select" value={f.pairingId} onChange={(e) => applyPairing(e.target.value)}>
              <option value="">— ไม่เชื่อมโยง —</option>
              {pairings.map((p) => <option key={p.id} value={p.id}>{p.sireId} × {p.damId}</option>)}
            </select>
          </div>
          <div className="form-field"><label>ชนิดพันธุ์</label><input className="form-input" value={f.species} onChange={(e) => set("species", e.target.value)} placeholder="เช่น Dynastes hercules hercules" /></div>
          <div className="form-field"><label>รหัสสายพันธุ์ (สำหรับ Gen โค้ด)</label><input className="form-input mono" value={f.speciesCode} onChange={(e) => set("speciesCode", e.target.value.toUpperCase())} placeholder="เช่น CCA" /></div>
          <div className="form-field"><label>จำนวนไข่ (ฟอง)</label><input className="form-input" type="number" min="0" value={f.eggCount} onChange={(e) => set("eggCount", e.target.value)} /></div>
          <div className="form-field"><label>จำนวนหนอน/ตัวอ่อน (ตัว)</label><input className="form-input" type="number" min="0" value={f.larvaCount} onChange={(e) => set("larvaCount", e.target.value)} /></div>
          <div className="form-field">
            <label>ห้องเลี้ยง</label>
            <select className="form-select" value={f.enclosureId} onChange={(e) => set("enclosureId", e.target.value)}>
              <option value="">—</option>
              {enclosures.map((en) => <option key={en.id} value={en.id}>{en.name}</option>)}
            </select>
          </div>
          <div className="form-field"><label>วันที่เริ่มบันทึก</label><div className="date-field-wrap"><input className="form-input" type="date" value={f.dateStarted} onChange={(e) => set("dateStarted", e.target.value)} /></div></div>
          <div className="form-field span2"><label>วัสดุเพาะ</label><input className="form-input" placeholder="เช่น Premium Mat สูตร L3, มาตรฐาน EU" value={f.substrateType} onChange={(e) => set("substrateType", e.target.value)} /></div>
          <div className="form-field"><label>ขนาด (L)</label><input className="form-input" type="number" min="0" step="0.5" placeholder="เช่น 5" value={f.boxSizeL} onChange={(e) => set("boxSizeL", e.target.value)} /></div>
          <div className="form-field span2">
            <label className="form-check-label" style={{ marginTop: 0 }}>
              <input type="checkbox" checked={f.useRottenWood} onChange={(e) => set("useRottenWood", e.target.checked)} />
              ใช้ไม้ผุ
            </label>
          </div>
          {f.useRottenWood && (
            <div className="form-field span2">
              <label>จำนวนไม้ผุ (0-3 ชิ้น)</label>
              <div style={{ display: "flex", gap: 6 }}>
                {[0, 1, 2, 3].map((n) => (
                  <button
                    key={n} type="button"
                    className={`btn btn-sm ${Number(f.rottenWoodCount || 0) === n ? "btn-active" : ""}`}
                    style={{ flex: 1, justifyContent: "center" }}
                    onClick={() => set("rottenWoodCount", n)}
                  >{n}</button>
                ))}
              </div>
            </div>
          )}
          <div className="form-field span2">
            <label>ระดับการอัดแมท: {compactionLabel(f.compaction)} ({f.compaction}%)</label>
            <input
              type="range" min="0" max="100" step="1" className="compaction-slider"
              value={f.compaction} onChange={(e) => set("compaction", Number(e.target.value))}
            />
            <div className="compaction-scale"><span>ไม่อัดแมท</span><span>แน่นปานกลาง</span><span>อัดแน่นมาก</span></div>
          </div>
          <div className="form-field span2">
            <label>ตัวอย่างหน้าตัด (Section Preview)</label>
            <TubSection useRottenWood={f.useRottenWood} rottenWoodCount={f.rottenWoodCount} compaction={f.compaction} boxSizeL={f.boxSizeL} />
          </div>
          <div className="form-field span2"><label>บันทึกเพิ่มเติม</label><textarea className="form-input" rows={2} value={f.notes} onChange={(e) => set("notes", e.target.value)} /></div>
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>ยกเลิก</button>
          <button className="btn btn-primary" onClick={submit}><Save size={14} /> บันทึก</button>
        </div>
      </div>
    </div>
  );
}


/* -------------------------------- Breeding ---------------------------------- */

function Breeding({ beetles, setBeetles, pairings, setPairings, tubs, setTubs, enclosures, catalog }) {
  const [form, setForm] = useState({
    sireId: "", damId: "", dateStarted: todayISO(), notes: "",
    enclosureId: "", substrateType: "", useRottenWood: false, rottenWoodCount: "", compaction: 70, boxSizeL: "",
  });
  const males = beetles.filter((b) => (b.gender === "male" || b.gender === "pair") && b.stage === "adult");
  const females = beetles.filter((b) => (b.gender === "female" || b.gender === "pair") && b.stage === "adult");

  // Creates the pairing AND its linked rearing box together in one action.
  const addPairingWithBox = () => {
    if (!form.sireId || !form.damId) return;
    const pairingId = uid("PAIR");
    const dam = beetles.find((b) => b.id === form.damId);
    const sire = beetles.find((b) => b.id === form.sireId);
    const src = dam || sire;
    setPairings((prev) => [{ id: pairingId, sireId: form.sireId, damId: form.damId, dateStarted: form.dateStarted, notes: form.notes, status: "pairing" }, ...prev]);
    setTubs((prev) => [{
      id: uid("TUB"),
      label: `กล่องเพาะ ${form.sireId} × ${form.damId}`,
      pairingId,
      speciesCode: src ? src.speciesCode : "",
      species: src ? src.species : "",
      eggCount: 0, larvaCount: 0,
      enclosureId: form.enclosureId,
      dateStarted: form.dateStarted,
      substrateType: form.substrateType,
      useRottenWood: form.useRottenWood,
      rottenWoodCount: form.useRottenWood ? Math.min(3, Math.max(0, Number(form.rottenWoodCount) || 0)) : "",
      compaction: form.compaction,
      boxSizeL: form.boxSizeL,
      notes: "",
    }, ...prev]);
    setForm({ sireId: "", damId: "", dateStarted: todayISO(), notes: "", enclosureId: "", substrateType: "", useRottenWood: false, rottenWoodCount: "", compaction: 70, boxSizeL: "" });
  };

  const setStatus = (id, status) => setPairings((prev) => prev.map((p) => (p.id === id ? { ...p, status } : p)));
  const removePairing = (id) => {
    setPairings((prev) => prev.filter((p) => p.id !== id));
    setTubs((prev) => prev.filter((t) => t.pairingId !== id));
  };
  const enclosureName = (id) => (enclosures.find((e) => e.id === id) || {}).name || "—";
  const nextStatus = { pairing: "laying", laying: "complete", complete: "complete" };
  const statusLabel = { pairing: "กำลังจับคู่", laying: "วางไข่", complete: "เสร็จสิ้น" };

  const [editTub, setEditTub] = useState(null);
  const saveEditedTub = (tub) => {
    setTubs((prev) => prev.map((t) => (t.id === tub.id ? tub : t)));
    setEditTub(null);
  };

  const bumpField = (tubId, field, delta) => setTubs((prev) => prev.map((t) => (t.id === tubId ? { ...t, [field]: Math.max(0, (Number(t[field]) || 0) + delta) } : t)));

  const harvestAll = (tub, kind) => {
    const field = kind === "egg" ? "eggCount" : "larvaCount";
    const qty = Number(tub[field]) || 0;
    if (qty < 1) return;

    const catId = findCategoryForSpeciesCode(tub.speciesCode, catalog);
    const cat = catalog[catId] || catalog.other;
    const entry = cat.species.find((s) => s.code === tub.speciesCode);
    const speciesName = entry ? entry.name : (tub.species || "");
    const enclosure = enclosures.find((e) => e.id === tub.enclosureId);
    const stage = kind === "egg" ? "egg" : "l1";
    const codeBase = tub.speciesCode && tub.speciesCode !== "custom" ? tub.speciesCode : "SPC";
    const year = new Date().getFullYear();
    const prefix = `${codeBase}-${year}-`;
    const refLabel = nextTubCode(tub, kind, qty, year);

    setBeetles((prevBeetles) => {
      let max = 0;
      prevBeetles.forEach((b) => {
        if (b.id && b.id.startsWith(prefix)) {
          const num = parseInt(b.id.slice(prefix.length), 10);
          if (!isNaN(num) && num > max) max = num;
        }
      });
      const created = [];
      for (let i = 0; i < qty; i++) {
        max += 1;
        created.push({
          ...emptyBeetle(),
          id: `${prefix}${String(max).padStart(3, "0")}`,
          categoryId: catId,
          speciesCode: tub.speciesCode || "",
          customSpeciesName: tub.species || "",
          species: speciesName,
          stage,
          foodType: tub.substrateType || "",
          temp: enclosure ? enclosure.temp : "",
          notes: `ย้ายจากถังเพาะ: ${tub.label || tub.id} · รหัสอ้างอิง ${refLabel}`,
        });
      }
      return [...created, ...prevBeetles];
    });

    setTubs((prev) => prev.map((t) => (t.id === tub.id ? { ...t, [field]: 0 } : t)));
  };

  const linkedTubOf = (pairingId) => tubs.find((t) => t.pairingId === pairingId);

  return (
    <div>
      <div className="jod-header">
        <div>
          <div className="jod-title disp">BREEDING</div>
          <div className="jod-desc">{pairings.length} คู่ผสมทั้งหมด · {males.length} ตัวผู้พร้อมผสม · {females.length} ตัวเมียพร้อมผสม</div>
        </div>
      </div>

      <div className="card" style={{ marginBottom: 20 }}>
        <div className="panel-title"><span className="tag-dot" />สร้างคู่ผสมใหม่ + กล่องเพาะ</div>
        <div className="pairbox-form-layout">
          <div className="pairbox-preview-col">
            <label>ตัวอย่างกล่องเพาะ (Section Preview)</label>
            <TubSection useRottenWood={form.useRottenWood} rottenWoodCount={form.rottenWoodCount} compaction={form.compaction} boxSizeL={form.boxSizeL} />
          </div>
          <div className="pairbox-fields-col">
            <div className="pairbox-field-row">
              <div className="form-field">
                <label>พ่อพันธุ์ (ตัวผู้)</label>
                <select className="form-select" value={form.sireId} onChange={(e) => setForm({ ...form, sireId: e.target.value })}>
                  <option value="">— เลือกพ่อพันธุ์ —</option>
                  {males.map((m) => <option key={m.id} value={m.id}>{m.id} · {m.species}{m.sizeMm ? ` · ${m.sizeMm}mm` : ""}</option>)}
                </select>
              </div>
              <div className="form-field">
                <label>แม่พันธุ์ (ตัวเมีย)</label>
                <select className="form-select" value={form.damId} onChange={(e) => setForm({ ...form, damId: e.target.value })}>
                  <option value="">— เลือกแม่พันธุ์ —</option>
                  {females.map((m) => <option key={m.id} value={m.id}>{m.id} · {m.species}{m.sizeMm ? ` · ${m.sizeMm}mm` : ""}</option>)}
                </select>
              </div>
            </div>
            <div className="pairbox-field-row">
              <div className="form-field"><label>วันที่เริ่มจับคู่</label><div className="date-field-wrap"><input className="form-input" type="date" value={form.dateStarted} onChange={(e) => setForm({ ...form, dateStarted: e.target.value })} /></div></div>
              <div className="form-field">
                <label>ห้องเลี้ยง</label>
                <select className="form-select" value={form.enclosureId} onChange={(e) => setForm({ ...form, enclosureId: e.target.value })}>
                  <option value="">—</option>
                  {enclosures.map((en) => <option key={en.id} value={en.id}>{en.name}</option>)}
                </select>
              </div>
            </div>
            <div className="pairbox-field-row-substrate">
              <div className="form-field"><label>วัสดุเพาะ</label><input className="form-input" placeholder="เช่น Premium Mat สูตร L3, มาตรฐาน EU" value={form.substrateType} onChange={(e) => setForm({ ...form, substrateType: e.target.value })} /></div>
              <div className="form-field"><label>ขนาด (L)</label><input className="form-input" type="number" min="0" step="0.5" placeholder="เช่น 5" value={form.boxSizeL} onChange={(e) => setForm({ ...form, boxSizeL: e.target.value })} /></div>
            </div>
            <div className="form-field span2">
              <label className="form-check-label" style={{ marginTop: 0 }}>
                <input type="checkbox" checked={form.useRottenWood} onChange={(e) => setForm({ ...form, useRottenWood: e.target.checked })} />
                ใช้ไม้ผุ
              </label>
            </div>
            {form.useRottenWood && (
              <div className="form-field span2">
                <label>จำนวนไม้ผุ (0-3 ชิ้น)</label>
                <div style={{ display: "flex", gap: 6 }}>
                  {[0, 1, 2, 3].map((n) => (
                    <button
                      key={n} type="button"
                      className={`btn btn-sm ${Number(form.rottenWoodCount || 0) === n ? "btn-active" : ""}`}
                      style={{ flex: 1, justifyContent: "center" }}
                      onClick={() => setForm({ ...form, rottenWoodCount: n })}
                    >{n}</button>
                  ))}
                </div>
              </div>
            )}
            <div className="form-field span2">
              <label>ระดับการอัดแมท: {compactionLabel(form.compaction)} ({form.compaction}%)</label>
              <input type="range" min="0" max="100" step="1" className="compaction-slider" value={form.compaction} onChange={(e) => setForm({ ...form, compaction: Number(e.target.value) })} />
              <div className="compaction-scale"><span>ไม่อัดแมท</span><span>แน่นปานกลาง</span><span>อัดแน่นมาก</span></div>
            </div>
            <div className="form-field span2"><label>บันทึกเพิ่มเติม</label><input className="form-input" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></div>
          </div>
        </div>

        <div className="modal-foot">
          <button className="btn btn-primary" onClick={addPairingWithBox} disabled={!form.sireId || !form.damId}><Plus size={14} /> บันทึกคู่ผสม + กล่องเพาะ</button>
        </div>
      </div>

      {pairings.length === 0 ? (
        <div className="empty-state"><Heart size={30} /><div>ยังไม่มีการจับคู่ผสมพันธุ์</div></div>
      ) : (
        <div className="beetle-grid">
          {pairings.map((p) => {
            const tub = linkedTubOf(p.id);
            return (
              <div className="beetle-card" key={p.id}>
                <div className="beetle-card-top">
                  <span className="specimen-tag mono">{tub && tub.speciesCode ? tub.speciesCode : "—"}</span>
                  <div style={{ textAlign: "right" }}>
                    <div className="recent-meta">{p.dateStarted}</div>
                    {daysSince(p.dateStarted) !== null && <div className="pairbox-daycount mono">{formatElapsed(daysSince(p.dateStarted))}</div>}
                  </div>
                </div>
                <div className="jod-eyebrow" style={{ marginBottom: 3 }}>กล่องเพาะ</div>
                <div className="disp pairbox-title">{p.sireId} × {p.damId}</div>
                {tub && tub.species && <div className="beetle-sub">{tub.species}</div>}
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                  <span className={`status-pill status-${p.status}`}>{statusLabel[p.status]}</span>
                  {p.status !== "complete" && <button className="btn btn-sm" onClick={() => setStatus(p.id, nextStatus[p.status])}>ทำเครื่องหมายเป็น "{statusLabel[nextStatus[p.status]]}"</button>}
                </div>

                {tub ? (
                  <>
                    <TubSection useRottenWood={tub.useRottenWood} rottenWoodCount={tub.rottenWoodCount} compaction={tub.compaction} boxSizeL={tub.boxSizeL} progressDots={layingProgressDots(daysSince(p.dateStarted))} />
                    <div className="tub-stage-row">
                      <div className="tub-stage-box">
                        <div className="tub-stage-label">ไข่</div>
                        <div className="tub-counter">
                          <button className="btn btn-sm" onClick={() => bumpField(tub.id, "eggCount", -1)}>−</button>
                          <span className="stat-value disp" style={{ fontSize: 18 }}>{tub.eggCount || 0}</span>
                          <button className="btn btn-sm" onClick={() => bumpField(tub.id, "eggCount", 1)}>+</button>
                        </div>
                        <div className="tub-stage-code mono">{nextTubCode(tub, "egg", tub.eggCount || 1)}</div>
                        <button className="btn btn-sm btn-primary" disabled={!tub.eggCount} onClick={() => harvestAll(tub, "egg")}>เก็บทั้งหมด</button>
                      </div>
                      <div className="tub-stage-box">
                        <div className="tub-stage-label">หนอน</div>
                        <div className="tub-counter">
                          <button className="btn btn-sm" onClick={() => bumpField(tub.id, "larvaCount", -1)}>−</button>
                          <span className="stat-value disp" style={{ fontSize: 18 }}>{tub.larvaCount || 0}</span>
                          <button className="btn btn-sm" onClick={() => bumpField(tub.id, "larvaCount", 1)}>+</button>
                        </div>
                        <div className="tub-stage-code mono">{nextTubCode(tub, "larva", tub.larvaCount || 1)}</div>
                        <button className="btn btn-sm btn-primary" disabled={!tub.larvaCount} onClick={() => harvestAll(tub, "larva")}>เก็บทั้งหมด</button>
                      </div>
                    </div>
                    <div className="beetle-meta"><span>ห้องเลี้ยง: {enclosureName(tub.enclosureId)}</span></div>
                  </>
                ) : (
                  <div className="empty-state" style={{ padding: 20 }}><BoxIcon size={22} /><div>ไม่มีกล่องเพาะผูกกับคู่นี้</div></div>
                )}

                <div className="beetle-actions">
                  {tub && <button className="btn btn-sm" onClick={() => setEditTub(tub)}><Pencil size={12} /> แก้ไข</button>}
                  <button className="btn btn-sm btn-danger" onClick={() => removePairing(p.id)}><Trash2 size={12} /> ลบ</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {editTub && <TubForm initial={editTub} pairings={pairings} enclosures={enclosures} beetles={beetles} onSave={saveEditedTub} onClose={() => setEditTub(null)} />}
    </div>
  );
}

/* -------------------------------- Settings ----------------------------------- */

function emptyEnclosure() { return { id: "", name: "", temp: "", humidity: "", notes: "" }; }

function Settings({ enclosures, setEnclosures }) {
  const [modal, setModal] = useState(null);
  const save = (enc) => {
    setEnclosures((prev) => {
      if (enc.id && prev.some((e) => e.id === enc.id)) return prev.map((e) => (e.id === enc.id ? enc : e));
      return [{ ...enc, id: uid("ENC") }, ...prev];
    });
    setModal(null);
  };
  const remove = (id) => setEnclosures((prev) => prev.filter((e) => e.id !== id));

  return (
    <div>
      <div className="jod-header">
        <div>
          <div className="jod-title disp">SETTINGS</div>
          <div className="jod-desc">ตั้งค่าสภาพแวดล้อมของแต่ละกล่อง/ตู้เลี้ยง</div>
        </div>
        <button className="btn btn-primary" onClick={() => setModal(emptyEnclosure())}><Plus size={14} /> เพิ่มห้องเลี้ยง</button>
      </div>

      {enclosures.length === 0 ? (
        <div className="empty-state"><SettingsIcon size={30} /><div>ยังไม่มีห้องเลี้ยงที่ตั้งค่าไว้</div></div>
      ) : enclosures.map((e) => (
        <div className="enclosure-card" key={e.id}>
          <div className="enclosure-top">
            <div className="panel-title" style={{ marginBottom: 0 }}><span className="tag-dot" />{e.name}</div>
            <div className="beetle-actions" style={{ borderTop: "none", paddingTop: 0 }}>
              <button className="btn btn-sm" onClick={() => setModal(e)}><Pencil size={12} /> แก้ไข</button>
              <button className="btn btn-sm btn-danger" onClick={() => remove(e.id)}><Trash2 size={12} /> ลบ</button>
            </div>
          </div>
          <div className="metric-row">
            <div className="metric"><Thermometer size={20} style={{color:"var(--accent)"}} /><div><div className="metric-value disp">{e.temp || "-"}°C</div><div className="metric-label">อุณหภูมิ</div></div></div>
            <div className="metric"><Droplets size={20} style={{color:"var(--accent)"}} /><div><div className="metric-value disp">{e.humidity || "-"}%</div><div className="metric-label">ความชื้น</div></div></div>
          </div>
          {e.notes && <div className="recent-meta" style={{ marginTop: 10 }}>{e.notes}</div>}
        </div>
      ))}

      {modal && (
        <div className="modal-backdrop" onClick={(ev) => ev.target === ev.currentTarget && setModal(null)}>
          <div className="modal" style={{ maxWidth: 460 }}>
            <div className="modal-head">
              <h3>{modal.id ? "แก้ไขห้องเลี้ยง" : "เพิ่มห้องเลี้ยงใหม่"}</h3>
              <button className="btn btn-ghost btn-sm" onClick={() => setModal(null)}><XIcon size={16} /></button>
            </div>
            <div className="form-grid">
              <div className="form-field span2"><label>ชื่อห้อง/ตู้เลี้ยง</label><input className="form-input" placeholder="เช่น ตู้เลี้ยง A - L3 Room" value={modal.name} onChange={(e) => setModal({ ...modal, name: e.target.value })} /></div>
              <div className="form-field"><label>อุณหภูมิเป้าหมาย (°C)</label><input className="form-input" type="number" step="0.1" value={modal.temp} onChange={(e) => setModal({ ...modal, temp: e.target.value })} /></div>
              <div className="form-field"><label>ความชื้นเป้าหมาย (%)</label><input className="form-input" type="number" step="1" value={modal.humidity} onChange={(e) => setModal({ ...modal, humidity: e.target.value })} /></div>
              <div className="form-field span2"><label>บันทึกเพิ่มเติม</label><textarea className="form-input" rows={2} value={modal.notes} onChange={(e) => setModal({ ...modal, notes: e.target.value })} /></div>
            </div>
            <div className="modal-foot">
              <button className="btn" onClick={() => setModal(null)}>ยกเลิก</button>
              <button className="btn btn-primary" onClick={() => save(modal)} disabled={!modal.name}><Save size={14} /> บันทึก</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ----------------------------------- App ------------------------------------- */

function App() {
  const [tab, setTab] = useState("dashboard");
  const [beetles, setBeetles] = useState(null);
  const [pairings, setPairings] = useState(null);
  const [enclosures, setEnclosures] = useState(null);
  const [tubs, setTubs] = useState(null);
  const [catalog, setCatalog] = useState(null);
  const theme = "dark"; // dark mode only
  const [googleUser, setGoogleUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);
  const [hasEntered, setHasEntered] = useState(false);

  // Data is namespaced per signed-in account: Supabase Postgres (real cross-device sync) when signed
  // in with Gmail and Supabase is configured, otherwise a local key scoped to that account's email —
  // and the original un-namespaced keys for Guests, so existing installs keep their data.
  const accountKey = googleUser && googleUser.email ? googleUser.email : null;

  // Load the saved theme, then restore/track the Supabase session. Supabase's Google sign-in
  // redirects the whole page away and back, so — unlike a popup flow — we can't get the signed-in
  // user back as a direct return value; instead we read the current session on mount (this is what
  // picks it up right after the redirect back from Google) and subscribe to future changes.
  useEffect(() => {
    let unsubscribe = null;
    (async () => {
      // hasEntered is intentionally NOT restored from storage — every fresh page load should show
      // the LOG-IN gate first, so the person always sees it before using the app.
      if (ensureSupabase()) {
        try {
          const { data } = await supabaseClientInstance.auth.getSession();
          setGoogleUser(mapSupabaseUser(data.session && data.session.user));
        } catch (e) {
          console.error("JOD: Supabase getSession failed", e);
        }
        const { data: sub } = supabaseClientInstance.auth.onAuthStateChange((_event, session) => {
          setGoogleUser(mapSupabaseUser(session && session.user));
        });
        unsubscribe = () => sub && sub.subscription && sub.subscription.unsubscribe();
      }
      setAuthReady(true);
    })();
    return () => { if (unsubscribe) unsubscribe(); };
  }, []);

  // (Re)load beetle data whenever the signed-in account changes — including right after the saved
  // session is restored on first load, and again any time the person signs in or out.
  useEffect(() => {
    if (!authReady) return;
    let cancelled = false;
    setBeetles(null); setPairings(null); setEnclosures(null); setTubs(null); setCatalog(null);
    (async () => {
      let rawBeetles = await loadData(googleUser, "beetles", []);
      const rawPairings = await loadData(googleUser, "pairings", []);
      let rawEnclosures = await loadData(googleUser, "enclosures", []);
      let rawTubs = await loadData(googleUser, "tubs", []);
      const rawCatalog = await loadData(googleUser, "catalog", defaultCatalog());

      // One-time cleanup: earlier versions of this app pre-filled new accounts with sample data.
      // Strip out any record that still exactly matches one of those old sample IDs/names, no matter
      // what else is in the collection (so a partially-edited/partially-deleted set still gets cleaned).
      const OLD_SEED_BEETLE_IDS = new Set(["DHH-2026-101", "DTIT-2026-014", "CCA-2026-007"]);
      rawBeetles = rawBeetles.filter((b) => !OLD_SEED_BEETLE_IDS.has(b.id));
      const OLD_SEED_ENCLOSURE_NAMES = new Set(["ตู้เลี้ยง A — ตัวเต็มวัย", "กล่อง L3 — ตัวอ่อน"]);
      rawEnclosures = rawEnclosures.filter((e) => !OLD_SEED_ENCLOSURE_NAMES.has(e.name));
      rawTubs = rawTubs.filter((t) => t.label !== "ถังเพาะ #1 — ไข่ CCA รุ่นกรกฎาคม");

      // Every tub only ever appears in the UI linked to its pairing (there's no "unlinked tubs" view
      // anymore) — so a tub whose pairingId doesn't match any current pairing is an invisible orphan
      // (e.g. left behind by older app versions). Drop those so the Overview count matches what's
      // actually reachable/visible on the Breeding page.
      const validPairingIds = new Set(rawPairings.map((p) => p.id));
      rawTubs = rawTubs.filter((t) => validPairingIds.has(t.pairingId));

      if (cancelled) return;
      setBeetles(rawBeetles.map(normalizeBeetle));
      setPairings(rawPairings);
      setEnclosures(rawEnclosures);
      setTubs(rawTubs.map(normalizeTub));
      setCatalog(rawCatalog && rawCatalog.other ? rawCatalog : { ...rawCatalog, other: { label: "หมวดหมู่อื่นๆ / กำหนดเอง", species: [] } });
    })();
    return () => { cancelled = true; };
  }, [authReady, accountKey]);

  useEffect(() => { if (beetles) saveData(googleUser, "beetles", beetles); }, [beetles]);
  useEffect(() => { if (pairings) saveData(googleUser, "pairings", pairings); }, [pairings]);
  useEffect(() => { if (enclosures) saveData(googleUser, "enclosures", enclosures); }, [enclosures]);
  useEffect(() => { if (tubs) saveData(googleUser, "tubs", tubs); }, [tubs]);
  useEffect(() => { if (catalog) saveData(googleUser, "catalog", catalog); }, [catalog]);

  const handleSignOut = () => {
    setGoogleUser(null);
    signOutSupabase();
    setHasEntered(false);
  };
  const handleContinueAsGuest = () => {
    setHasEntered(true);
  };

  // Wait for the initial session check to finish before deciding anything — otherwise an already
  // signed-in Gmail user would flash the LOG-IN gate for a moment before getSession() resolves.
  if (!authReady) {
    return <div className={`jod theme-${theme}`} style={{ alignItems: "center", justifyContent: "center" }}><div className="mono" style={{ color: "var(--text-faint)" }}>กำลังโหลดข้อมูล…</div></div>;
  }

  // Show the LOG-IN gate on entry until the person picks Guest or is already signed in. Checked
  // BEFORE the data-loading guard below: otherwise, right after logging out, the account-switch
  // triggers a data reload (beetles/tubs briefly become null again) and this would get stuck
  // showing "loading" instead of immediately returning to the gate.
  if (!hasEntered && !googleUser) {
    return <LoginGate theme={theme} onContinueAsGuest={handleContinueAsGuest} />;
  }

  if (!beetles || !pairings || !enclosures || !tubs || !catalog) {
    return <div className={`jod theme-${theme}`} style={{ alignItems: "center", justifyContent: "center" }}><div className="mono" style={{ color: "var(--text-faint)" }}>กำลังโหลดข้อมูล…</div></div>;
  }

  return (
    <div className={`jod theme-${theme}`}>
      <Sidebar
        tab={tab} setTab={setTab} counts={{ beetles: beetles.length, pairings: pairings.length }}
        theme={theme}
        googleUser={googleUser} onSignOut={handleSignOut}
      />
      <div className="jod-main">
        {tab === "dashboard" && <Dashboard beetles={beetles} pairings={pairings} enclosures={enclosures} tubs={tubs} setTab={setTab} theme={theme} />}
        {tab === "beetles" && <MyBeetles beetles={beetles} setBeetles={setBeetles} catalog={catalog} setCatalog={setCatalog} theme={theme} />}
        {tab === "breeding" && <Breeding beetles={beetles} setBeetles={setBeetles} pairings={pairings} setPairings={setPairings} tubs={tubs} setTubs={setTubs} enclosures={enclosures} catalog={catalog} />}
        {tab === "settings" && <Settings enclosures={enclosures} setEnclosures={setEnclosures} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
