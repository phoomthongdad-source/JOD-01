<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JOD-01</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: white;
      }
      .card {
        background: rgba(255,255,255,0.14);
        padding: 2rem 2.5rem;
        border-radius: 16px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
      }
      p {
        margin: 0;
        font-size: 1rem;
        opacity: 0.95;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>JOD-01</h1>
      <p>เว็บไซต์นี้ถูกเผยแพร่ผ่าน GitHub Pages แล้ว</p>
    </main>
  </body>
</html>
