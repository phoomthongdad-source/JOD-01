<style>
  html, body { margin: 0; padding: 0; overflow-x: hidden; max-width: 100%; }
  @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');

  .jod {
    font-family: 'Kanit', -apple-system, 'Segoe UI', Roboto, 'Noto Sans Thai', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    letter-spacing: 0.01em;
    transition: background .15s, color .15s;
    max-width: 100vw;
    overflow-x: hidden;
  }
  /* Reference palette — Frost #FCFAFC, Chalk #EAEBEB, Vapor #DCD7D6, Mist #C2C6C1,
     Sterling #B0B1B3, Graphite #A2A0A1, Pewter #8B8D8E, Smoke #747576, Slate #535353,
     Charcoal #3B3939, Carbon #262425, Obsidian #131213 — applied 60 (surface) / 30
     (structure) / 10 (accent) per mode. */
  .jod.theme-dark {
    --bg: #131213;           /* Obsidian — 60% dominant surface */
    --panel: #262425;        /* Carbon — 30% structure */
    --panel-2: #3B3939;      /* Charcoal — inset surfaces */
    --border: #535353;       /* Slate */
    --border-soft: rgba(116,117,118,0.35); /* Smoke */
    --text: #FCFAFC;         /* Frost — 10% accent/emphasis */
    --text-dim: #B0B1B3;     /* Sterling */
    --text-faint: #8B8D8E;   /* Pewter */
    --accent: #FCFAFC;       /* Frost — 10% accent */
    --accent-strong: #FCFAFC;
    --accent-dim: #747576;   /* Smoke */
    --accent-soft: rgba(252,250,252,0.16);
    --rust: #C2C6C1;         /* Mist — distinct tone for secondary badges */
    --rust-soft: rgba(194,198,193,0.18);
  }
  .jod.theme-light {
    --bg: #FCFAFC;           /* Frost — 60% dominant surface */
    --panel: #EAEBEB;        /* Chalk — 30% structure */
    --panel-2: #DCD7D6;      /* Vapor — inset surfaces */
    --border: #B0B1B3;       /* Sterling */
    --border-soft: rgba(194,198,193,0.6); /* Mist */
    --text: #131213;         /* Obsidian — 10% accent/emphasis */
    --text-dim: #535353;     /* Slate */
    --text-faint: #8B8D8E;   /* Pewter */
    --accent: #131213;       /* Obsidian — 10% accent */
    --accent-strong: #131213;
    --accent-dim: #A2A0A1;   /* Graphite */
    --accent-soft: rgba(19,18,19,0.09);
    --rust: #3B3939;         /* Charcoal — distinct tone for secondary badges */
    --rust-soft: rgba(59,57,57,0.14);
  }
  .jod * { box-sizing: border-box; }
  .jod ::selection { background: var(--accent-soft); }
  .jod .disp { font-family: 'Kanit', sans-serif; font-weight: 600; }
  .jod .mono { font-family: 'SF Mono', Consolas, Menlo, 'Courier New', monospace; }

  .jod-sidebar { width: 216px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border-soft); display: flex; flex-direction: column; padding: 20px 14px; gap: 4px; }
  .jod-brand { display: flex; align-items: center; justify-content: center; padding: 6px 10px 20px 10px; border-bottom: 1px solid var(--border-soft); margin-bottom: 14px; }

  .jod-nav-list { display: flex; flex-direction: column; gap: 4px; }
  .jod-nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: var(--text-dim); cursor: pointer; font-size: 13.5px; font-weight: 500; border: 1px solid transparent; transition: background .15s, color .15s, border-color .15s; }
  .jod-nav-item:hover { background: var(--panel-2); color: var(--text); }
  .jod-nav-item.active { background: var(--accent-soft); color: var(--accent-strong); border-color: var(--accent-dim); }
  .jod-nav-item svg { flex-shrink: 0; }
  .jod-sidebar-foot { margin-top: auto; padding: 10px; border-top: 1px solid var(--border-soft); font-size: 10.5px; color: var(--text-faint); line-height: 1.5; }
  .sidebar-account-row { display: flex; flex-direction: column; }
  .user-menu { position: relative; border-top: 1px solid var(--border-soft); padding-top: 10px; margin-top: 8px; }
  .user-menu-trigger {
    width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px;
    background: transparent; border: 1px solid transparent; cursor: pointer; text-align: left;
  }
  .user-menu-trigger:hover { background: var(--panel-2); border-color: var(--border-soft); }
  .user-menu-name { font-size: 12.5px; font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-menu-scrim { position: fixed; inset: 0; z-index: 39; }
  .user-menu-dropdown {
    position: absolute; bottom: calc(100% + 6px); left: 0; width: 100%; min-width: 200px; z-index: 40;
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px; padding: 6px;
    display: flex; flex-direction: column; gap: 3px; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .user-menu-option {
    display: flex; align-items: center; gap: 8px; padding: 8px 9px; border-radius: 7px; font-size: 12.5px;
    background: transparent; border: none; color: var(--text-dim); cursor: pointer; text-align: left; width: 100%;
  }
  .user-menu-option:hover:not(:disabled) { background: var(--panel-2); }
  .user-menu-option.active { color: var(--accent-strong); font-weight: 600; }
  .user-menu-option:disabled { cursor: default; }
  .sidebar-logout-btn { width: 100%; justify-content: center; margin-top: 6px; }
  .account-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .account-avatar-fallback { display: flex; align-items: center; justify-content: center; background: var(--panel-2); color: var(--text-faint); border: 1px solid var(--border-soft); }
  .account-hint { font-size: 10px; color: var(--text-faint); line-height: 1.5; }

  .login-gate { align-items: center; justify-content: center; padding: 20px; }
  .login-gate-card {
    width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--border-soft);
    border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .login-gate-title { font-size: 20px; font-weight: 700; letter-spacing: 0.04em; margin-top: 14px; }
  .login-gate-desc { font-size: 12px; color: var(--text-faint); margin-top: 6px; margin-bottom: 22px; }
  .login-gate-btn { width: 100%; justify-content: center; margin-bottom: 10px; padding: 11px; font-size: 13.5px; }

  .jod-main { flex: 1; padding: 28px 34px 60px; overflow-y: auto; max-height: 100vh; }
  .jod-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .settings-login-compact { display: flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 100px; padding: 4px 6px 4px 4px; }
  .settings-login-email { font-size: 10.5px; color: var(--text-dim); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jod-title { font-size: 26px; font-weight: 600; }
  .jod-eyebrow { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .jod-desc { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); transition: border-color .15s, background .15s; }
  .btn:hover { border-color: var(--accent-dim); }
  .btn-primary { background: var(--accent-soft); border-color: var(--accent-dim); color: var(--accent-strong); }
  .btn-primary:hover { background: rgba(134,168,105,0.24); }
  .btn-danger { color: var(--rust); }
  .btn-danger:hover { border-color: var(--rust); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-sm { padding: 5px 9px; font-size: 11.5px; }
  .btn-active { background: var(--accent-soft); border-color: var(--accent-dim); color: var(--accent-strong); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 12px; padding: 16px 18px; position: relative; }
  .card .pin { position: absolute; top: 12px; right: 12px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent-dim); }
  .stat-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint); margin-bottom: 8px; }
  .stat-value { font-family: 'Kanit', sans-serif; font-size: 32px; font-weight: 600; line-height: 1; }
  .stat-icon { color: var(--accent); margin-bottom: 10px; }

  .panel-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .panel-title .tag-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .row2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; margin-bottom: 14px; align-items: start; }

  .specimen-tag { font-family: 'SF Mono', Consolas, monospace; font-size: 11px; color: var(--accent-strong); background: var(--accent-soft); border: 1px solid var(--accent-dim); border-radius: 5px; padding: 2px 7px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .specimen-tag::before, .specimen-tag::after { content: '·'; color: var(--accent-dim); }

  .recent-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 4px; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; }
  .recent-row:last-child { border-bottom: none; }
  .recent-meta { color: var(--text-faint); font-size: 11px; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .search-box { display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--border-soft); border-radius: 8px; padding: 7px 11px; flex: 1; min-width: 180px; color: var(--text-faint); }
  .search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; width: 100%; }
  select.filter-select, select.form-select, input.form-input, textarea.form-input { background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 12.5px; padding: 7px 9px; outline: none; font-family: inherit; width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
  input.form-input[type="date"] { min-width: 0; max-width: 100%; }
  .date-field-wrap { overflow: hidden; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--border); }
  .date-field-wrap input.form-input[type="date"] { background: transparent; border: none; border-radius: 0; width: 100%; max-width: 100%; display: block; }
  select.filter-select { width: auto; }
  select.filter-select:focus, select.form-select:focus, input.form-input:focus, textarea.form-input:focus { border-color: var(--accent-dim); }

  .selection-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--accent-soft); border: 1px solid var(--accent-dim); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 12.5px; color: var(--accent-strong); }

  .beetle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .beetle-card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 12px; padding: 14px; position: relative; }
  .beetle-card.selectable { border-color: var(--accent-dim); }
  .beetle-select-box { position: absolute; top: 12px; left: 12px; width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .beetle-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .beetle-name { font-family: 'Kanit', sans-serif; font-size: 15px; font-weight: 600; margin: 8px 0 2px; }
  .pairbox-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; letter-spacing: -0.01em; }
  .pairbox-daycount { font-size: 9.5px; color: var(--accent-strong); margin-top: 2px; }
  .tubsection-progress { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .tubsection-progress-dot {
    position: absolute; width: max(1px, 1%); aspect-ratio: 1 / 1; border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, var(--accent) 55%, transparent 100%);
    box-shadow: 0 0 3px 1px var(--accent), 0 0 1px 0.5px #ffffff;
    opacity: 0.95; transform: translate(-50%, -50%);
    animation: dot-flicker 2.4s ease-in-out infinite;
  }
  @keyframes dot-flicker {
    0%, 100% { opacity: 0.4; filter: brightness(0.75) saturate(0.8); }
    50% { opacity: 1; filter: brightness(1.4) saturate(1.2); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tubsection-progress-dot { animation: none; opacity: 0.85; }
  }
  .beetle-sub { font-size: 11px; color: var(--text-faint); font-style: italic; margin-bottom: 10px; }
  .beetle-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 100px; border: 1px solid var(--border); color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; display: inline-flex; align-items: center; gap: 4px; }
  .badge.gender-male { color: var(--accent-strong); border-color: var(--accent-dim); font-weight: 700; }
  .badge.activity-status-eating { color: var(--accent-strong); border-color: var(--accent-dim); background: var(--accent-soft); font-weight: 700; }
  .badge.activity-status-dormant { color: var(--rust); border-color: var(--rust); background: var(--rust-soft); font-weight: 700; }
  .badge.gender-female { color: var(--rust); border-color: var(--rust); }
  .beetle-meta { font-size: 11.5px; color: var(--text-dim); display: flex; flex-direction: column; gap: 3px; margin-bottom: 10px; }
  .beetle-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; border-top: 1px solid var(--border-soft); padding-top: 10px; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-faint); }
  .empty-state svg { margin-bottom: 10px; opacity: 0.5; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(10,12,10,0.7); backdrop-filter: blur(2px); display: flex; align-items: flex-start; justify-content: center; z-index: 50; padding: 40px 20px; overflow-y: auto; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 640px; padding: 22px 24px 24px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-head h3 { font-family: 'Kanit', sans-serif; font-size: 19px; font-weight: 600; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pairbox-form-layout { display: grid; grid-template-columns: 1.7fr 1fr; gap: 22px; align-items: stretch; min-width: 0; }
  .pairbox-preview-col { display: flex; flex-direction: column; min-width: 0; }
  .pairbox-fields-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .pairbox-preview-col label, .pairbox-fields-col label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); margin-bottom: 5px; }
  .pairbox-field-row { display: flex; flex-direction: column; gap: 12px; }
  .pairbox-field-row-substrate { display: flex; flex-direction: row; gap: 12px; }
  .pairbox-field-row-substrate .form-field { flex: 1; min-width: 0; }
  .form-grid .span2 { grid-column: 1 / -1; }
  .form-field, .form-grid > *, .pairbox-fields-col > * { min-width: 0; }
  .form-field label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-faint); margin-bottom: 5px; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; min-width: 0; }
  .form-check-label { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 11px; color: var(--text-dim); text-transform: none; letter-spacing: 0; cursor: pointer; }
  .form-hint { font-size: 10.5px; color: var(--accent-strong); margin-top: 5px; }
  .growth-chart-empty { font-size: 11px; color: var(--text-faint); padding: 16px 0; text-align: center; }
  .growth-chart-svg { width: 100%; height: auto; aspect-ratio: 280 / 90; display: block; max-width: 420px; margin: 0 auto; }
  .growth-chart-meta { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-faint); margin-top: 4px; gap: 6px; }
  .mat-change-list { display: flex; flex-direction: column; gap: 5px; max-height: 140px; overflow-y: auto; }
  .mat-change-row { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 7px; padding: 6px 9px; font-size: 11.5px; }
  .mat-change-row span:first-child { flex: 1; color: var(--text-dim); }
  .image-picker { border: 1.5px dashed var(--border); border-radius: 10px; height: 150px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--panel-2); overflow: hidden; transition: border-color .15s; position: relative; }
  .image-picker:hover { border-color: var(--accent-dim); }
  .image-picker-preview { width: 100%; height: 100%; object-fit: cover; }
  .image-picker-empty { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--text-faint); font-size: 12px; }
  .beetle-card-image { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; display: block; }
  .view-switch { display: flex; gap: 4px; background: var(--panel-2); border: 1px solid var(--border-soft); border-radius: 8px; padding: 3px; }
  .view-switch .btn { border: none; background: transparent; }
  .view-switch .btn.btn-active { background: var(--accent-soft); border: 1px solid var(--accent-dim); }
  .box-card { background: var(--panel); border: 1px solid var(--border-soft); border-radius: 12px; padding: 0 14px 14px; overflow: hidden; }
  .box-card-lid { display: flex; justify-content: space-between; align-items: center; margin: 0 -14px 10px; padding: 10px 14px; background: var(--accent-soft); border-bottom: 2px solid var(--accent-dim); }
  .box-card-rows { display: flex; flex-direction: column; gap: 7px; margin: 10px 0 12px; }
  .box-card-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
  .box-card-row svg { color: var(--accent); flex-shrink: 0; }

  /* --- interactive CSS-3D crate (front/top/side faces built from flat divs + perspective) --- */
  .box3d-stage { position: relative; width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; perspective: 750px; margin-bottom: 4px; }
  .box3d-shadow { position: absolute; left: 50%; bottom: 12px; width: 118px; height: 18px; margin-left: -59px; border-radius: 50%; background: rgba(0,0,0,0.3); filter: blur(6px); transition: transform .45s ease, opacity .45s ease; }
  .box3d { position: relative; width: 126px; height: 100px; transform-style: preserve-3d; transform: rotateX(-18deg) rotateY(26deg); transition: transform .45s cubic-bezier(.2,.7,.3,1); animation: box3d-bob 4.5s ease-in-out infinite; }
  .box-card:hover .box3d { transform: rotateX(-18deg) rotateY(50deg) translateY(-6px); animation-play-state: paused; }
  .box-card:hover .box3d-shadow { transform: scale(0.85); opacity: 0.6; }
  .box3d-face { position: absolute; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; background: rgba(128,128,128,0.14); backdrop-filter: blur(0.5px); }
  .box3d-front, .box3d-back { width: 126px; height: 100px; }
  .box3d-front { transform: translateZ(44px); }
  .box3d-back { transform: rotateY(180deg) translateZ(44px); }
  .box3d-front img { width: 100%; height: 100%; object-fit: cover; opacity: 0.94; position: relative; z-index: 2; }
  .box3d-top { width: 126px; height: 88px; top: 6px; transform: rotateX(90deg) translateZ(50px); background: rgba(20,20,20,0.55); }
  .jod.theme-light .box3d-top { background: rgba(30,30,30,0.7); }
  .box3d-side, .box3d-left { width: 88px; height: 100px; left: 19px; background: rgba(128,128,128,0.3); }
  .box3d-side { transform: rotateY(90deg) translateZ(63px); }
  .box3d-left { transform: rotateY(-90deg) translateZ(63px); }
  .box3d-vent {
    position: absolute; top: 14%; left: 24%; width: 52%; height: 58%;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 3px;
    background-color: rgba(0,0,0,0.2);
    background-image: radial-gradient(rgba(255,255,255,0.55) 1px, transparent 1.4px);
    background-size: 9px 9px; background-position: 4px 4px;
  }
  /* furnished interior — a true horizontal ground plane (not a flat overlay) plus solid substrate

/* ------------------------------ Charts (hand-rolled, no deps) ------------------------------ */

function polarPoint(cx, cy, r, angleDeg) {
  const rad = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}
function donutSlicePath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const clampedEnd = Math.min(endAngle, startAngle + 359.99);
  const so = polarPoint(cx, cy, rOuter, clampedEnd);
  const eo = polarPoint(cx, cy, rOuter, startAngle);
  const si = polarPoint(cx, cy, rInner, clampedEnd);
  const ei = polarPoint(cx, cy, rInner, startAngle);
  const largeArc = clampedEnd - startAngle <= 180 ? 0 : 1;
  return `M ${so.x} ${so.y} A ${rOuter} ${rOuter} 0 ${largeArc} 0 ${eo.x} ${eo.y} L ${ei.x} ${ei.y} A ${rInner} ${rInner} 0 ${largeArc} 1 ${si.x} ${si.y} Z`;
}
function DonutChart({ data, colors }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  let cursor = 0;
  const cx = 100, cy = 100, rOuter = 90, rInner = 54;
  return (
    <svg viewBox="0 0 200 200" width="100%" height="210">
      {data.map((d, i) => {
        const angle = (d.value / total) * 360;
        const path = donutSlicePath(cx, cy, rOuter, rInner, cursor, cursor + angle);
        cursor += angle;
        return <path key={i} d={path} fill={colors[i % colors.length]} style={{ stroke: "var(--panel)" }} strokeWidth="2" />;
      })}
    </svg>
  );
}
function SimpleBarChart({ data }) {
  const maxVal = Math.max(1, ...data.map((d) => d.value));
  return (
    <div className="bar-chart">
      {data.map((d, i) => (
        <div className="bar-chart-col" key={i}>
          <div className="bar-chart-value mono">{d.value}</div>
          <div className="bar-chart-bar" style={{ height: `${(d.value / maxVal) * 130}px` }} />
          <div className="bar-chart-label">{d.name}</div>
        </div>
      ))}
    </div>
  );
}

/** Default catalog for brand-new accounts — starts empty (just the permanent fallback "other"
 *  bucket). Each person builds their own categories/species from Settings; this is saved as their
 *  own per-account data (loadData/saveData "catalog"), same as their beetles/pairings. */
function defaultCatalog() {

}

/** Auto-derives a short internal species code from the name the person types (used to prefix
 *  auto-generated beetle IDs), guaranteed unique within the given list of already-used codes. */
function deriveSpeciesCode(name, existingCodes) {
  const base = (name || "").toUpperCase().replace(/[^A-Z0-9ก-๙]/g, "").slice(0, 6) || "SPC";
  let code = base;
  let n = 1;
  while (existingCodes.includes(code)) {
    n += 1;
    code = `${base}${n}`;
  }
  return code;
}

function nextRunningId(speciesCode, beetles, year = new Date().getFullYear()) {
  const code = speciesCode && speciesCode !== "custom" ? speciesCode : "SPC";
  const prefix = `${code}-${year}-`;
  let max = 0;
  beetles.forEach((b) => {
    if (b.id && b.id.startsWith(prefix)) {
      const n = parseInt(b.id.slice(prefix.length), 10);
      if (!isNaN(n) && n > max) max = n;
    }
  });
  return `${prefix}${String(max + 1).padStart(3, "0")}`;
}

/** Renders a QR code entirely client-side (via qrcode-generator) as a PNG data URL — no network
 *  call, no cross-origin taint issues when drawing it into a canvas for PNG/PDF export. */
function makeQrDataUrl(text, cellSize = 4, margin = 2) {
  try {
    if (typeof qrcode !== "function") return "";
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    return qr.createDataURL(cellSize, margin);
  } catch (e) {
    console.error("QR generation failed", e);
    return "";
  }
}

/** Generates the reference code (or range) for the next egg/larva unit(s) about to leave a rearing
 *  tub, e.g. CCA-2026-EGG-17 for one, or CCA-2026-EGG-15~17 for a batch of 3 — always scoped to
 *  how many of that stage are currently recorded in the tub. */
function nextTubCode(tub, kind, qty = 1, year = new Date().getFullYear()) {
  const code = tub.speciesCode || "SPC";
  const tag = kind === "egg" ? "EGG" : "LAR";
  const available = kind === "egg" ? Number(tub.eggCount) || 0 : Number(tub.larvaCount) || 0;
  if (available <= 0) return "—";
  const n = Math.max(1, Math.min(qty, available));
  const toSeq = available;
  const fromSeq = Math.max(1, available - n + 1);
  return n <= 1
    ? `${code}-${year}-${tag}-${String(toSeq).padStart(2, "0")}`
    : `${code}-${year}-${tag}-${String(fromSeq).padStart(2, "0")}~${String(toSeq).padStart(2, "0")}`;
}

/** Reads an image file, downsizes it to keep local storage lean, and returns a JPEG data URL. */
function resizeImageFile(file, maxDim = 480, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("invalid image"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/** Finds which catalog category a species code belongs to (used when promoting a tub to a beetle). */
function findCategoryForSpeciesCode(code, catalog) {
  for (const [catId, cat] of Object.entries(catalog)) {
    if (cat.species.some((s) => s.code === code)) return catId;
  }
  return "other";
}

function normalizeBeetle(b) {
  let stage = b.stage;
  if (stage === "larva") {

  return {

    stage: stage || "adult",
    sizeMm: b.sizeMm !== undefined ? b.sizeMm : b.size,
    weightGrams: b.weightGrams !== undefined ? b.weightGrams : b.weight,

}

/** Migrates tubs saved by older versions of JOD (single count+stage) to separate egg/larva counters. */
function normalizeTub(t) {
  if (t.eggCount !== undefined || t.larvaCount !== undefined) {
    return t.compaction !== undefined ? t : { ...t, compaction: 70 };
  }
  const c = Number(t.count) || 0;
  return { ...t, eggCount: t.stage === "egg" ? c : 0, larvaCount: t.stage === "egg" ? 0 : c, compaction: t.compaction !== undefined ? t.compaction : 70 };
}

/** Names the compaction zone for a 0-100 slider value, per the 3-way split requested. */
function compactionLabel(v) {
  const n = Number(v) || 0;
  if (n >= 67) return "อัดแน่นมาก";

/** Days elapsed since a given YYYY-MM-DD date (e.g. since a pairing was recorded), floored at 0. */
function daysSince(dateStr) {
  if (!dateStr) return null;
  const start = new Date(`${dateStr}T00:00:00`);
  if (isNaN(start.getTime())) return null;
  const diff = Math.floor((Date.now() - start.getTime()) / (1000 * 60 * 60 * 24));
  return diff < 0 ? 0 : diff;
}

/** Formats an elapsed-days count as a real-time-friendly string — plain days (zero-padded) under
 *  a week, whole weeks under a month, and whole months beyond that. Used for both the beetle
 *  intake-date counter and the breeding-pairing day counter, so both read consistently. */
function formatElapsed(days) {
  if (days === null || days === undefined) return "";
  if (days < 7) return `${String(days).padStart(2, "0")} วัน`;
  if (days < 30) return `${Math.floor(days / 7)} สัปดาห์`;
  return `${Math.floor(days / 30)} เดือน`;
}

/** Estimated egg-laying progress dot count — starts at 5 on day 0, grows by 1 per day, caps at 25. */
function layingProgressDots(days) {
  if (days === null) return 5;
  return Math.min(25, 5 + Math.max(0, days));
}

/** Deterministic pseudo-random 0-1 value from a seed — used to scatter dots randomly but stably
 *  (same seed always gives the same position, so dots don't jump around on re-render). */
function pseudoRandom(seed) {
  const x = Math.sin(seed * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

const hasClaudeStorage = typeof window !== "undefined" && window.storage && typeof window.storage.get === "function";
// If window.storage errors even once (e.g. it's present but the backing service is unavailable),
// stop retrying it for the rest of the session and use localStorage instead — this is also exactly
// what happens automatically outside Claude (GitHub Pages, local file, etc.), where window.storage
// doesn't exist at all and hasClaudeStorage is false from the start.
let storageBackendFailed = false;

async function loadKey(key, fallback) {
  if (hasClaudeStorage && !storageBackendFailed) {
    try {
      const r = await window.storage.get(key, false);
      return r ? JSON.parse(r.value) : fallback;
    } catch {
      // A throw here can simply mean "key not found yet" — not necessarily a broken backend,
      // so fall through to localStorage for this read without flipping the permanent flag.
    }
  }
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}
async function saveKey(key, value) {
  if (hasClaudeStorage && !storageBackendFailed) {
    try {
      await window.storage.set(key, JSON.stringify(value), false);
      return;
    } catch (e) {
      console.warn("JOD: window.storage is unavailable — switching to localStorage for this session.", e);
      storageBackendFailed = true;
    }
  }
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.error("JOD: localStorage save failed", e);
  }
}

const LABEL_SIZES = [
  { value: "30x20", w: 30, h: 20 },
  { value: "40x30", w: 40, h: 30 },
  { value: "50x30", w: 50, h: 30 },

];
const DEFAULT_LABEL_SIZE = LABEL_SIZES[5]; // 80x50mm

/** Injects/updates a @page rule so window.print() uses the chosen physical LABLE size. */
function setPrintPageSize(w, h) {
  let styleEl = document.getElementById("jod-page-size");
  if (!styleEl) {
    styleEl = document.createElement("style");
    styleEl.id = "jod-page-size";
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = `@page { size: ${w}mm ${h}mm; margin: 0; }`;
}

/** Rasterizes a printed LABLE DOM node to a canvas sized to match its physical mm dimensions at 300dpi. */
/** Wraps text onto multiple lines within maxWidth, returning the y position after the last line drawn. */
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const words = String(text).split(" ");
  let line = "";
  let lines = 0;
  let cursorY = y;
  for (let i = 0; i < words.length; i++) {
    const test = line ? `${line} ${words[i]}` : words[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, cursorY);
      line = words[i];
      cursorY += lineHeight;
      lines += 1;
      if (maxLines && lines >= maxLines - 1) {
        const rest = words.slice(i).join(" ");
        let truncated = rest;
        while (ctx.measureText(`${truncated}…`).width > maxWidth && truncated.length > 1) {
          truncated = truncated.slice(0, -1);
        }
        ctx.fillText(truncated.length < rest.length ? `${truncated}…` : rest, x, cursorY);
        return cursorY;
      }
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, cursorY);
  return cursorY;
}

/** Draws a LABLE entirely with the Canvas 2D API (no HTML/SVG snapshot), sized to match the chosen
 *  physical mm dimensions at 300dpi. Only fills, strokes, text, and a locally-generated data-URL QR
 *  image are drawn — none of which can ever taint the canvas, so PNG/PDF export always works. */
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/** Draws the LABLE as a detailed dark-themed info sheet (matching the on-screen ใบข้อมูล card:
 *  tag pill, species name, QR box, field grid, notes) — entirely with the Canvas 2D API. */
function drawLabelToCanvas(beetle, size, theme = "dark") {
  return new Promise((resolve) => {
    const mmToPx = 300 / 25.4;
    const width = Math.max(1, Math.round(size.w * mmToPx));
    const height = Math.max(1, Math.round(size.h * mmToPx));
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext("2d");
    const scale = (width / 800) * 1.6;

    const C = theme === "dark"
      ? {
          bg: "#131213", border: "#535353", borderSoft: "rgba(83,83,83,0.5)",
          text: "#FCFAFC", textDim: "#B0B1B3", textFaint: "#8B8D8E",
          accentStrong: "#FCFAFC", accentSoft: "rgba(252,250,252,0.16)", accentDim: "#747576",
        }
      : {
          bg: "#FCFAFC", border: "#B0B1B3", borderSoft: "rgba(194,198,193,0.7)",
          text: "#131213", textDim: "#535353", textFaint: "#8B8D8E",
          accentStrong: "#131213", accentSoft: "rgba(19,18,19,0.09)", accentDim: "#A2A0A1",
        };

    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, width, height);
    ctx.strokeStyle = C.border;
    ctx.lineWidth = Math.max(1, 1.5 * scale);
    ctx.setLineDash([5 * scale, 4 * scale]);
    ctx.strokeRect(ctx.lineWidth, ctx.lineWidth, width - ctx.lineWidth * 2, height - ctx.lineWidth * 2);
    ctx.setLineDash([]);

    const pad = 20 * scale;
    const qrSize = Math.min(90 * scale, width * 0.26, height * 0.32);
    const qrX = width - pad - qrSize;
    const qrY = pad;
    const leftW = Math.max(20, width - pad * 2 - qrSize - 14 * scale);
    ctx.textBaseline = "alphabetic";
    ctx.textAlign = "left";

    // ID tag pill
    ctx.font = `700 ${10 * scale}px monospace`;
    const tagText = beetle.id;
    const tagPad = 8 * scale;
    const tagH = 20 * scale;
    const tagW = Math.min(leftW, ctx.measureText(tagText).width + tagPad * 2 + 14 * scale);
    roundRectPath(ctx, pad, pad, tagW, tagH, 5 * scale);
    ctx.fillStyle = C.accentSoft;
    ctx.fill();
    ctx.strokeStyle = C.accentDim;
    ctx.lineWidth = Math.max(1, scale);
    roundRectPath(ctx, pad, pad, tagW, tagH, 5 * scale);
    ctx.stroke();
    ctx.fillStyle = C.accentStrong;
    ctx.fillText(`◆ ${tagText}`, pad + tagPad, pad + tagH / 2 + 3.5 * scale);

    // species name (wraps up to 2 lines)
    let y = pad + tagH + 20 * scale;
    ctx.fillStyle = C.text;
    ctx.font = `700 ${15 * scale}px sans-serif`;
    const speciesText = beetle.species || beetle.customSpeciesName || "ไม่ระบุชนิดพันธุ์";
    y = wrapCanvasText(ctx, speciesText, pad, y, leftW, 18 * scale, 2);

    if (beetle.subSpecies) {
      y += 15 * scale;
      ctx.fillStyle = C.textFaint;
      ctx.font = `italic 400 ${9.5 * scale}px sans-serif`;
      ctx.fillText(beetle.subSpecies, pad, y);
    }

    // QR box (white)
    const qrPad = 5 * scale;
    ctx.fillStyle = "#ffffff";
    roundRectPath(ctx, qrX - qrPad, qrY - qrPad, qrSize + qrPad * 2, qrSize + qrPad * 2, 6 * scale);
    ctx.fill();

    const drawGridAndNotes = () => {
      let gridY = Math.max(y + 26 * scale, qrY + qrSize + qrPad * 2 + 20 * scale);
      const rows = [
        ["เพศ", (GENDERS.find((g) => g.value === beetle.gender) || {}).label || "-"],
        ["ระยะ", STAGE_LABEL(beetle)],
        ["ขนาด", beetle.sizeMm ? `${beetle.sizeMm} mm` : "-"],
        ["น้ำหนัก", beetle.weightGrams ? `${beetle.weightGrams} g` : "-"],
        ["แหล่งกำเนิด", beetle.locality || "-"],
        ["ไลน์", beetle.line || "-"],
        ["พ่อพันธุ์", beetle.sire || "-"],
        ["แม่พันธุ์", beetle.dam || "-"],
        ["อุณหภูมิ", beetle.temp ? `${beetle.temp}°C` : "-"],
        ["รับเข้า", beetle.dateReceived || "-"],
      ];
      const colGap = 16 * scale;
      const colW = (width - pad * 2 - colGap) / 2;
      const rowH = 24 * scale;
      const maxRows = Math.max(0, Math.floor((height - gridY - pad) / rowH)) * 2;
      const visibleRows = rows.slice(0, Math.max(rows.length, maxRows > 0 ? maxRows : rows.length));

      for (let i = 0; i < rows.length; i += 2) {
        const rowIdx = i / 2;
        const rowY = gridY + rowIdx * rowH;
        if (rowY > height - pad) break;
        [0, 1].forEach((c) => {
          const item = rows[i + c];
          if (!item) return;
          const colX = pad + c * (colW + colGap);
          ctx.fillStyle = C.textFaint;
          ctx.font = `600 ${7.5 * scale}px sans-serif`;
          ctx.textAlign = "left";
          ctx.fillText(item[0].toUpperCase(), colX, rowY);
          ctx.fillStyle = C.text;
          ctx.font = `600 ${10 * scale}px monospace`;
          ctx.textAlign = "right";
          ctx.fillText(item[1], colX + colW, rowY);
          ctx.textAlign = "left";
          ctx.strokeStyle = C.borderSoft;
          ctx.setLineDash([2 * scale, 2 * scale]);
          ctx.lineWidth = Math.max(1, scale);
          ctx.beginPath();
          ctx.moveTo(colX, rowY + 7 * scale);
          ctx.lineTo(colX + colW, rowY + 7 * scale);
          ctx.stroke();
          ctx.setLineDash([]);
        });
      }

      let afterGridY = gridY + Math.ceil(rows.length / 2) * rowH + 4 * scale;
      if (beetle.notes && afterGridY < height - pad) {
        ctx.strokeStyle = C.borderSoft;
        ctx.lineWidth = Math.max(1, scale);
        ctx.beginPath();
        ctx.moveTo(pad, afterGridY);
        ctx.lineTo(width - pad, afterGridY);
        ctx.stroke();
        afterGridY += 15 * scale;
        ctx.fillStyle = C.textDim;
        ctx.font = `400 ${9 * scale}px sans-serif`;
        wrapCanvasText(ctx, beetle.notes, pad, afterGridY, width - pad * 2, 12 * scale, 3);
      }

      resolve(canvas);
    };

    const qrData = makeQrDataUrl(`JOD-BEETLE:${beetle.id}`, 5, 1);
    if (!qrData) { drawGridAndNotes(); return; }
    const qrImg = new Image();
    qrImg.onload = () => {
      ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
      drawGridAndNotes();
    };
    qrImg.onerror = () => drawGridAndNotes();
    qrImg.src = qrData;
  });
}

async function downloadLabelAsPdf(beetle, size, theme = "dark") {
  if (typeof window.jspdf === "undefined") {
    alert("โหลดไลบรารีสร้าง PDF ไม่สำเร็จ (jsPDF) — ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองรีเฟรชหน้านี้");
    return;
  }
  try {
    const canvas = await drawLabelToCanvas(beetle, size, theme);
    const { jsPDF } = window.jspdf;
    // orientation must be set explicitly to match w/h — otherwise jsPDF's default "portrait"
    // silently swaps a landscape-shaped custom [w,h] array, producing a rotated/wrong page size.
    const orientation = size.w >= size.h ? "landscape" : "portrait";
    const doc = new jsPDF({ orientation, unit: "mm", format: [size.w, size.h] });
    doc.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, size.w, size.h);
    doc.save(`LABLE_${beetle.id}_${size.w}x${size.h}mm.pdf`);
  } catch (e) {
    console.error("LABLE PDF export failed", e);
    alert(`สร้างไฟล์ PDF ไม่สำเร็จ${e && e.message ? ` (${e.message})` : ""} ลองใหม่อีกครั้ง`);
  }
}
async function downloadAllLabelsAsPdf(beetles, size, theme = "dark") {
  if (typeof window.jspdf === "undefined") {
    alert("โหลดไลบรารีสร้าง PDF ไม่สำเร็จ (jsPDF) — ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองรีเฟรชหน้านี้");
    return;
  }
  try {
    const { jsPDF } = window.jspdf;
    const orientation = size.w >= size.h ? "landscape" : "portrait";
    const doc = new jsPDF({ orientation, unit: "mm", format: [size.w, size.h] });
    for (let i = 0; i < beetles.length; i++) {
      const canvas = await drawLabelToCanvas(beetles[i], size, theme);
      if (i > 0) doc.addPage([size.w, size.h], orientation);
      doc.addImage(canvas.toDataURL("image/png"), "PNG", 0, 0, size.w, size.h);
    }
    doc.save(`LABLE_batch_${size.w}x${size.h}mm.pdf`);
  } catch (e) {
    console.error("LABLE bulk PDF export failed", e);
    alert(`สร้างไฟล์ PDF ไม่สำเร็จ${e && e.message ? ` (${e.message})` : ""} ลองใหม่อีกครั้ง`);
  }
}

/** Small SVG line chart plotting weight-over-time from a mat-change log, colored green when the
 *  overall trend is rising and rust when falling (flat/neutral for a single point or no change). */
function GrowthChart({ entries }) {
  const sorted = [...entries].filter((e) => e.date && e.weight !== "" && e.weight !== undefined).sort((a, b) => a.date.localeCompare(b.date));
  if (sorted.length === 0) {
    return <div className="growth-chart-empty">ยังไม่มีข้อมูลน้ำหนัก — เพิ่มบันทึกด้านล่างเพื่อดูกราฟการเจริญเติบโต</div>;
  }
  const weights = sorted.map((e) => Number(e.weight));
  const minW = Math.min(...weights), maxW = Math.max(...weights);
  const range = maxW - minW || 1;
  const W = 280, H = 90, PAD = 12;
  const trend = weights[weights.length - 1] - weights[0];
  const color = trend > 0 ? "var(--accent-strong)" : trend < 0 ? "var(--rust)" : "var(--text-faint)";
  const pts = sorted.map((e, i) => {
    const x = sorted.length === 1 ? W / 2 : PAD + (i / (sorted.length - 1)) * (W - PAD * 2);
    const y = H - PAD - ((Number(e.weight) - minW) / range) * (H - PAD * 2);
    return { x, y, w: e.weight, d: e.date };
  });
  const path = pts.map((p, i) => `${i === 0 ? "M" : "L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} className="growth-chart-svg" preserveAspectRatio="xMidYMid meet">
        <path d={path} fill="none" stroke={color} strokeWidth="2" />
        {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={color} />)}
      </svg>
      <div className="growth-chart-meta">
        <span>{sorted[0].date} · {sorted[0].weight} g</span>
        <span className="mono" style={{ color }}>{trend > 0 ? "▲" : trend < 0 ? "▼" : "—"} {Math.abs(trend).toFixed(2)} g</span>
        <span>{sorted[sorted.length - 1].date} · {sorted[sorted.length - 1].weight} g</span>
      </div>
    </div>
  );
}


function BeetleForm({ initial, beetles, catalog, setCatalog, onSave, onClose }) {
  const [f, setF] = useState(initial);
  const [autoId, setAutoId] = useState(false);
  const fileInputRef = useRef(null);
  const set = (k, v) => setF((prev) => ({ ...prev, [k]: v }));

  useEffect(() => {
    if (!f.categoryId) {
      const firstCatId = Object.keys(catalog).find((id) => id !== "other");
      if (firstCatId) {
        const cat = catalog[firstCatId];
        setF((prev) => ({ ...prev, categoryId: firstCatId, speciesCode: cat.species.length ? cat.species[0].code : "" }));
      }
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const handleFileChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await resizeImageFile(file);
      set("imageUrl", dataUrl);
    } catch (err) {
      console.error("image resize failed", err);
      alert("ไม่สามารถโหลดรูปภาพนี้ได้ ลองใช้ไฟล์รูปภาพอื่น");
    }
    e.target.value = "";
  };

  const activeCat = catalog[f.categoryId] || catalog.other;
  const speciesEntry = activeCat.species.find((s) => s.code === f.speciesCode);

  // Section 2 (ID & Lifecycle) unlocks only once Taxonomy is filled in: a category plus either a
  // picked species or a typed custom species name.
  const taxonomyComplete = !!(f.categoryId && f.speciesCode);

  const [showAddCat, setShowAddCat] = useState(false);
  const [newCatLabel, setNewCatLabel] = useState("");
  const [showAddSpecies, setShowAddSpecies] = useState(false);
  const [newSpeciesName, setNewSpeciesName] = useState("");

  const quickAddCategory = () => {
    const label = newCatLabel.trim();
    if (!label) return;
    const id = uid("cat");
    setCatalog((prev) => ({ ...prev, [id]: { label, species: [] } }));
    setF((prev) => ({ ...prev, categoryId: id, speciesCode: "" }));
    setNewCatLabel(""); setShowAddCat(false);
  };
  const quickAddSpecies = () => {
    const name = newSpeciesName.trim();
    if (!name) return;
    const existingCodes = activeCat.species.map((s) => s.code);
    const code = deriveSpeciesCode(name, existingCodes);
    setCatalog((prev) => ({ ...prev, [f.categoryId]: { ...prev[f.categoryId], species: [...prev[f.categoryId].species, { code, name }] } }));
    setF((prev) => ({ ...prev, speciesCode: code }));
    setNewSpeciesName(""); setShowAddSpecies(false);
  };

  const [editingCat, setEditingCat] = useState(false);
  const [catLabelDraft, setCatLabelDraft] = useState("");
  const startEditCat = () => { setCatLabelDraft(activeCat.label); setEditingCat(true); };
  const saveEditCat = () => {
    const label = catLabelDraft.trim();
    if (label) setCatalog((prev) => ({ ...prev, [f.categoryId]: { ...prev[f.categoryId], label } }));
    setEditingCat(false);
  };

  const [editingSpecies, setEditingSpecies] = useState(false);
  const [speciesNameDraft, setSpeciesNameDraft] = useState("");
  const startEditSpecies = () => { if (speciesEntry) { setSpeciesNameDraft(speciesEntry.name); setEditingSpecies(true); } };
  const saveEditSpecies = () => {
    const name = speciesNameDraft.trim();
    if (name && speciesEntry) {
      setCatalog((prev) => ({
        ...prev,
        [f.categoryId]: { ...prev[f.categoryId], species: prev[f.categoryId].species.map((s) => (s.code === f.speciesCode ? { ...s, name } : s)) },
      }));
    }
    setEditingSpecies(false);
  };

  const removeCategory = () => {
    if (!f.categoryId || f.categoryId === "other") return;
    if (!window.confirm(`ลบหมวดหมู่ "${activeCat.label}" ทั้งหมวดหมู่ (รวมสายพันธุ์ย่อยข้างในทั้งหมด)?`)) return;
    setCatalog((prev) => {
      const next = { ...prev };
      delete next[f.categoryId];
      return next;
    });
    setF((prev) => ({ ...prev, categoryId: "", speciesCode: "" }));
  };
  const removeSpecies = () => {
    if (!speciesEntry) return;
    if (!window.confirm(`ลบสายพันธุ์ "${speciesEntry.name}"?`)) return;
    setCatalog((prev) => ({ ...prev, [f.categoryId]: { ...prev[f.categoryId], species: prev[f.categoryId].species.filter((s) => s.code !== f.speciesCode) } }));
    setF((prev) => ({ ...prev, speciesCode: "" }));
  };

  // Growth tracking (L1-L3/pupa): a log of mat-change events (date + weight), used to draw a
  // simple growth-trend chart referencing weight gained/lost between changes.
  const [newMatDate, setNewMatDate] = useState(todayISO());
  const [newMatWeight, setNewMatWeight] = useState("");
  const matChanges = f.matChanges || [];
  const addMatChange = () => {
    const w = newMatWeight.trim();
    if (!newMatDate || w === "") return;
    const entry = { id: uid("MAT"), date: newMatDate, weight: Number(w) };
    setF((prev) => ({ ...prev, matChanges: [...(prev.matChanges || []), entry].sort((a, b) => a.date.localeCompare(b.date)) }));
    setNewMatWeight("");
  };
  const removeMatChange = (id) => setF((prev) => ({ ...prev, matChanges: (prev.matChanges || []).filter((m) => m.id !== id) }));

  const potentialSires = beetles.filter((b) => (b.gender === "male" || b.gender === "pair") && b.stage === "adult" && b.id !== f.id);
  const potentialDams = beetles.filter((b) => (b.gender === "female" || b.gender === "pair") && b.stage === "adult" && b.id !== f.id);

  const currentSpeciesCode = f.speciesCode || "SPC";
  const previewId = nextRunningId(currentSpeciesCode, beetles);

  const handleParentInput = (role, value) => {
    set(role, value);
    if (!autoId) return;
    const parent = beetles.find((b) => b.id === value);
    if (!parent) return;
    setF((prev) => ({
      ...prev,
      [role]: value,
      categoryId: parent.categoryId || prev.categoryId,
      speciesCode: parent.speciesCode || prev.speciesCode,
      locality: parent.locality || prev.locality,
      line: parent.line || prev.line,
    }));
  };

  const handleCategoryChange = (newCat) => {
    const cat = catalog[newCat];
    setF((prev) => ({ ...prev, categoryId: newCat, speciesCode: cat && cat.species.length ? cat.species[0].code : "" }));
  };

  const submit = () => {
    const finalSpeciesName = speciesEntry ? speciesEntry.name : "";
    const finalId = autoId || !f.id ? nextRunningId(currentSpeciesCode, beetles) : f.id;
    onSave({
      ...f, id: finalId, species: finalSpeciesName,
      sizeMm: f.sizeMm === "" ? undefined : Number(f.sizeMm),
      weightGrams: f.weightGrams === "" ? undefined : Number(f.weightGrams),
      temp: f.temp === "" ? undefined : Number(f.temp),
    });
  };

  return (
    <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-head">
          <h3>{initial.id ? "แก้ไขข้อมูลด้วง" : "เพิ่มรายการด้วงใหม่"}</h3>
          <button className="btn btn-ghost btn-sm" onClick={onClose}><XIcon size={16} /></button>
        </div>

        <div className="form-grid">
          <div className="form-section-label">1. Taxonomy — สายพันธุ์</div>
          <div className="form-field">
            <label>หมวดหมู่หลัก</label>
            <div style={{ display: "flex", gap: 6 }}>
              <select className="form-select" value={f.categoryId} onChange={(e) => handleCategoryChange(e.target.value)}>
                {Object.entries(catalog).filter(([id]) => id !== "other").map(([id, c]) => <option key={id} value={id}>{c.label}</option>)}
              </select>
              {f.categoryId && <button type="button" className="btn btn-sm" title="แก้ไขชื่อหมวดหมู่" onClick={startEditCat}><Pencil size={12} /></button>}
              {f.categoryId && f.categoryId !== "other" && <button type="button" className="btn btn-sm btn-danger" title="ลบหมวดหมู่" onClick={removeCategory}><Trash2 size={12} /></button>}
              <button type="button" className="btn btn-sm" title="เพิ่มหมวดหมู่หลัก" onClick={() => setShowAddCat((v) => !v)}><Plus size={12} /></button>
            </div>
            {editingCat && (
              <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                <input className="form-input" placeholder="ชื่อหมวดหมู่" value={catLabelDraft} onChange={(e) => setCatLabelDraft(e.target.value)} />
                <button type="button" className="btn btn-sm btn-primary" onClick={saveEditCat} disabled={!catLabelDraft.trim()}>บันทึก</button>
              </div>
            )}
            {showAddCat && (
              <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                <input className="form-input" placeholder="ชื่อหมวดหมู่ใหม่" value={newCatLabel} onChange={(e) => setNewCatLabel(e.target.value)} />
                <button type="button" className="btn btn-sm btn-primary" onClick={quickAddCategory} disabled={!newCatLabel.trim()}>เพิ่ม</button>
              </div>
            )}
          </div>
          <div className="form-field">
            <label>สายพันธุ์ย่อย</label>
            <div style={{ display: "flex", gap: 6 }}>
              <select className="form-select" value={f.speciesCode} onChange={(e) => set("speciesCode", e.target.value)}>
                {activeCat.species.map((s) => <option key={s.code} value={s.code}>{s.name}</option>)}
              </select>
              {speciesEntry && <button type="button" className="btn btn-sm" title="แก้ไขชื่อสายพันธุ์" onClick={startEditSpecies}><Pencil size={12} /></button>}
              {speciesEntry && <button type="button" className="btn btn-sm btn-danger" title="ลบสายพันธุ์" onClick={removeSpecies}><Trash2 size={12} /></button>}

/** Extracts a beetle tag ID from any of JOD's QR formats (label QR, sheet QR, or a bare ID). */
function parseBeetleIdFromQr(text) {
  const raw = (text || "").trim();
  const labelMatch = raw.match(/^JOD-BEETLE:(.+)$/i);
  if (labelMatch) return labelMatch[1].trim();
  const sheetMatch = raw.match(/ID:\s*(\S+)/i);
  if (sheetMatch) return sheetMatch[1].trim();
  return raw;
}

/** Scans a QR code via the phone/webcam camera (using jsQR) and looks up the matching beetle. */
function QRScannerModal({ beetles, onFound, onClose }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const [status, setStatus] = useState("starting"); // starting | scanning | notfound | error
  const [message, setMessage] = useState("");
  const [attempt, setAttempt] = useState(0);

  useEffect(() => {
    let cancelled = false;

    const stopCamera = () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };

    const tick = () => {
      if (cancelled) return;
      const video = videoRef.current;
      const canvas = canvasRef.current;
      if (video && canvas && video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        if (typeof jsQR === "function") {
          const result = jsQR(imageData.data, imageData.width, imageData.height);
          if (result && result.data) {
            const id = parseBeetleIdFromQr(result.data);
            const found = beetles.find((b) => b.id === id);
            stopCamera();
            if (found) { onFound(found); return; }
            setStatus("notfound");
            setMessage(`ไม่พบด้วงรหัส "${id}" ในคอลเลกชัน`);
            return;
          }
        }
      }
      rafRef.current = requestAnimationFrame(tick);
    };

    (async () => {
      if (typeof jsQR !== "function") {
        setStatus("error");
        setMessage("โหลดไลบรารีสแกน QR ไม่สำเร็จ (jsQR) — ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วลองรีเฟรชหน้านี้");
        return;
      }
      if (typeof window !== "undefined" && !window.isSecureContext) {
        setStatus("error");
        setMessage("กล้องใช้งานได้เฉพาะบนเว็บที่เปิดผ่าน HTTPS (หรือ localhost) เท่านั้น — ลองเปิดผ่านลิงก์ GitHub Pages แทนการเปิดไฟล์ตรงๆ");
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("error");
        setMessage("เบราว์เซอร์นี้ไม่รองรับการเข้าถึงกล้อง");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        setStatus("scanning");
        tick();
      } catch (e) {
        console.error("camera error", e);
        setStatus("error");
        setMessage("เปิดกล้องไม่สำเร็จ — กรุณาอนุญาตการใช้งานกล้องให้เว็บนี้ในเบราว์เซอร์");
      }
    })();

    return () => { cancelled = true; stopCamera(); };
  }, [attempt]);

  return (
    <div className="modal-backdrop" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{ maxWidth: 420 }}>
        <div className="modal-head">
          <h3>สแกน QR Code</h3>
          <button className="btn btn-ghost btn-sm" onClick={onClose}><XIcon size={16} /></button>
        </div>
        <div className="scanner-frame">
          <video ref={videoRef} playsInline muted className="scanner-video" />
          <canvas ref={canvasRef} style={{ display: "none" }} />
          {status === "scanning" && <div className="scanner-reticle" />}
        </div>
        {status === "starting" && <div className="scanner-status">กำลังเปิดกล้อง…</div>}
        {status === "scanning" && <div className="scanner-status">เล็งกล้องไปที่ป้าย QR ของด้วง</div>}
        {status === "notfound" && <div className="scanner-status error">{message}</div>}
        {status === "error" && <div className="scanner-status error">{message}</div>}
        <div className="modal-foot">
          <button className="btn" onClick={onClose}>ปิด</button>
          {(status === "notfound" || status === "error") && (
            <button className="btn btn-primary" onClick={() => { setStatus("starting"); setMessage(""); setAttempt((n) => n + 1); }}>สแกนอีกครั้ง</button>
          )}
        </div>
      </div>
    </div>
  );
}

              <div className="beetle-badges">

                <button className="btn btn-sm" onClick={() => setModal(b)}><Pencil size={12} /> แก้ไข</button>

      {modal && <BeetleForm initial={modal === "new" ? emptyBeetle() : { ...emptyBeetle(), ...modal }} beetles={beetles} catalog={catalog} setCatalog={setCatalog} onSave={save} onClose={() => setModal(null)} />}

      {showBulk && <BulkLabelModal beetles={selectedBeetles} theme={theme} onClose={() => setShowBulk(false)} />}

  );
